name: efterlev-scan

# Runs Efterlev's full compliance pipeline (init → scan → agent gap →
# agent document → poam) against this repository on every push to main
# and every PR touching infra, the workflow files themselves, or the
# Evidence Manifests. Uploads the full `.efterlev/reports/` artifact for
# download from the Actions tab.
#
# Scan target is the repo root (`.`) — Efterlev rglob-walks `*.tf` from
# there (catches `infra/terraform/`), reads `.github/workflows/*.yml`
# for the github-source detectors, and loads `.efterlev/manifests/*.yml`
# for procedural KSI attestations. Scoping the target to `infra/terraform/`
# would skip the workflow detectors and the manifests.

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/**'
      - '.efterlev/manifests/**'
  pull_request:
    # `pull_request` (not `pull_request_target`) — GitHub withholds secrets
    # from workflows triggered by forks, which is what we want.
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/**'
      - '.efterlev/manifests/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: efterlev report run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out govnotes-demo
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Efterlev from PyPI
        run: pipx install efterlev

      - name: Verify install
        run: |
          which efterlev
          pipx list | grep efterlev || true

      - name: efterlev init
        # `report run` skips init if `.efterlev/` already exists, but
        # the workspace dir is half-present in this repo (manifests are
        # committed under `.efterlev/manifests/`; the FRMR cache is
        # gitignored). `--force` regenerates the cache without
        # touching manifests. (Tracked upstream as an Efterlev v0.1.x
        # heuristic-fix item: `report run` should detect the cache,
        # not the dir.)
        run: efterlev init --target . --force

      - name: efterlev doctor
        # Pre-flight diagnostics — Python, workspace, FRMR cache,
        # ANTHROPIC_API_KEY shape. No network calls. Output is for
        # the run log; we don't gate on this step.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: efterlev doctor --target . || true

      - name: efterlev report run
        # Full pipeline: scan → agent gap → agent document → poam.
        # Init was handled explicitly above; report run detects the
        # workspace and skips its own init step.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: efterlev report run --target .

      - name: efterlev agent remediate (showcase)
        # Demonstrates the remediation flow on the canonical "missing
        # encryption on user_uploads" gap (#1 in DELIBERATE_GAPS.md).
        # The diff is written to `.efterlev/reports/` and uploaded
        # below; nothing is applied to the codebase.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: efterlev agent remediate --ksi KSI-SVC-VRI --target .

      - name: Upload reports + provenance store
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efterlev-run-${{ github.run_number }}
          path: |
            .efterlev/reports/
            .efterlev/store.db
            .efterlev/receipts.log
            .efterlev/redactions/
          retention-days: 30
          if-no-files-found: warn
