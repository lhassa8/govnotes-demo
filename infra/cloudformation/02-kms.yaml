AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Govnotes FedRAMP boundary — KMS customer-managed keys.
  Four CMKs: app data, audit logs, static assets, finance reports.
  Mirrors the KMS section of infra/terraform/data.tf, including the
  deliberate gaps (`assets` CMK with rotation disabled; `reports`
  policy with broad account-wide use).

Parameters:
  EnvName:
    Type: String
    Default: govnotes-fedramp-prod

Resources:
  # --- App data CMK (RDS, app logs, app S3) -------------------------------

  AppCmk:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for Govnotes app data (RDS, app logs, app S3)
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${EnvName}-app-cmk

  AppCmkAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${EnvName}-app
      TargetKeyId: !Ref AppCmk

  # --- Logs CMK (CloudTrail + audit) --------------------------------------

  LogsCmk:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for CloudTrail and other audit logs
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowCloudTrail
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${EnvName}-logs-cmk

  LogsCmkAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${EnvName}-logs
      TargetKeyId: !Ref LogsCmk

  # --- Assets CMK (DELIBERATE GAP: rotation disabled) ---------------------
  # Mirrors the `assets` CMK in data.tf. Rotation is being handled
  # manually on a 12-month cadence, TBD moving to automatic once we
  # confirm the manual process with the ops team. KSI-SVC-PRR / KSI-SVC-VRI
  # surfaces this as partial CMK-rotation coverage.

  AssetsCmk:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for Govnotes static-assets bucket
      EnableKeyRotation: false
      PendingWindowInDays: 30
      KeySpec: SYMMETRIC_DEFAULT
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${EnvName}-assets-cmk

  AssetsCmkAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${EnvName}-assets
      TargetKeyId: !Ref AssetsCmk

  # --- Reports CMK (DELIBERATE GAP: broad account-wide policy) ------------
  # Any principal in the account can use this key for the analytics ETL
  # flow. Temporary — revisit once the per-service role model lands.
  # KSI-IAM-ELP surfaces this as partial least-privilege coverage.

  ReportsCmk:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for the internal finance-analytics reports bucket
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowAccountUse
            Effect: Allow
            Principal:
              AWS: "*"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
      Tags:
        - Key: Name
          Value: !Sub ${EnvName}-reports-cmk

  ReportsCmkAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${EnvName}-reports
      TargetKeyId: !Ref ReportsCmk

Outputs:
  AppCmkArn:
    Value: !GetAtt AppCmk.Arn
    Export:
      Name: !Sub ${EnvName}-app-cmk-arn

  LogsCmkArn:
    Value: !GetAtt LogsCmk.Arn
    Export:
      Name: !Sub ${EnvName}-logs-cmk-arn

  AssetsCmkArn:
    Value: !GetAtt AssetsCmk.Arn
    Export:
      Name: !Sub ${EnvName}-assets-cmk-arn

  ReportsCmkArn:
    Value: !GetAtt ReportsCmk.Arn
    Export:
      Name: !Sub ${EnvName}-reports-cmk-arn
