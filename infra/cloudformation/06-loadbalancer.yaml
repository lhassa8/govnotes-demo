AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Govnotes FedRAMP boundary — application load balancer.
  ALB + target group + three listeners (HTTPS modern, HTTP fixed-404,
  legacy HTTPS on 8443 with older TLS policy). Mirrors
  infra/terraform/loadbalancer.tf, preserving the port-80-no-redirect
  and legacy-TLS deliberate gaps.

Parameters:
  EnvName:
    Type: String
    Default: govnotes-fedramp-prod

  AcmCertificateArn:
    Type: String
    Description: ACM cert ARN serving app.gov.govnotes.com + legacy-api.gov.govnotes.com.
    Default: arn:aws:acm:us-east-1:590183808443:certificate/00000000-0000-0000-0000-000000000000

Resources:
  # --- ALB ----------------------------------------------------------------

  AppAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${EnvName}-app-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !ImportValue
          Fn::Sub: ${EnvName}-public-subnet-id-a
        - !ImportValue
          Fn::Sub: ${EnvName}-public-subnet-id-b
      SecurityGroups:
        - !ImportValue
          Fn::Sub: ${EnvName}-alb-sg-id
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: "true"
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !ImportValue
            Fn::Sub: ${EnvName}-backups-bucket
        - Key: access_logs.s3.prefix
          Value: alb-access-logs
      Tags:
        - Key: Name
          Value: !Sub ${EnvName}-app-alb

  # --- Target group -------------------------------------------------------

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${EnvName}-app-tg
      Port: 3000
      Protocol: HTTP
      VpcId: !ImportValue
        Fn::Sub: ${EnvName}-vpc-id
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: Name
          Value: !Sub ${EnvName}-app-tg

  # --- HTTPS listener — modern TLS 1.3 policy -----------------------------

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppAlb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  # --- HTTP listener (DELIBERATE GAP: 404 fixed-response, no redirect) ----
  # Port-80 listener. See network.tf TODO about wiring this to a permanent
  # redirect to 443. Today it just 404s, which is what we want for now.

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            MessageBody: not found
            StatusCode: "404"

  # --- Legacy API listener (DELIBERATE GAP: older TLS policy) -------------
  # A handful of older API integrations at our existing government customers
  # talk to a separate hostname (legacy-api.gov.govnotes.com). The hostname
  # maps to the same ALB but uses an older TLS policy for legacy API
  # compatibility. Tracked for deprecation in the Q3 API-modernization epic.

  LegacyApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppAlb
      Port: 8443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-2016-08
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

Outputs:
  AppTargetGroupArn:
    Value: !Ref AppTargetGroup
    Export:
      Name: !Sub ${EnvName}-app-tg-arn
