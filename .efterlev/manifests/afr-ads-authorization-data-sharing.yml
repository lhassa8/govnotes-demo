ksi: KSI-AFR-ADS
name: Authorization Data Sharing
evidence:
  - type: attestation
    statement: >
      Govnotes shares FedRAMP authorization data with all parties required
      by the FedRAMP Authorization Data Sharing (ADS) process. Sharing is
      governed by the data-sharing matrix maintained at
      docs/compliance/ads-matrix.md, which lists the recipient (FedRAMP
      PMO, sponsoring agency AO, current 3PAO), the artifact set (SSP,
      SAR, POA&M, continuous monitoring deliverables), the delivery
      channel (FedRAMP Marketplace + sponsoring agency's secure portal),
      and the refresh cadence (monthly POA&M, quarterly ConMon, annual
      SAR refresh). The platform-security team confirms each recipient's
      access at the start of every quarter and tracks any access changes
      in the Q-end ConMon report. The ADS matrix was last reviewed
      against the FedRAMP rev-5 baseline 2026-04-08; the next review is
      tied to the 2026-Q3 ConMon cycle.
    attested_by: vp-security@govnotes.fed
    attested_at: 2026-04-15
    reviewed_at: 2026-04-15
    next_review: 2026-10-15
    supporting_docs:
      - ./docs/compliance/ads-matrix.md
      - ./docs/compliance/fedramp-marketplace-listing.md
      - https://wiki.govnotes.fed/compliance/ads-process
